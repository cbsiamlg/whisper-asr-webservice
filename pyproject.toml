[tool.poetry]
name = "whisper-asr-webservice"
version = "1.4.0"
description = "Whisper ASR Webservice is a general-purpose speech recognition webservice."
homepage  = "https://github.com/cbsiamlg/whisper-asr-webservice/"
authors = [ 
"Justin Nguyen",
"Zachariah Mustafa",
"Adam Leary" 
]
readme = "README.md"
packages = [
{ include = "app" }
]

# CUDA-enabled PyTorch source. "explicit" so ONLY packages that pin
# `source = "pytorch-cu126"` (torch, below) query this index. As "supplemental"
# poetry probes it for every package during resolution, and the index returns
# HTTP 403 for anything it doesn't host (e.g. transformers), which poetry treats
# as a fatal auth error and aborts the lock (AMLG-13277).
[[tool.poetry.source]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
# Python floor pinned at 3.12 (AMLG-13204). 3.13+ is blocked by the native ML
# stack: numba/llvmlite/torch(cu126) ship no cp313/cp314 wheels for this dep set.
# See README "Python version" section before widening this range.
python = ">=3.12,<3.13"
unidecode = "^1.3.4"
uvicorn = { extras = ["standard"], version = "^0.18.2" }
gunicorn = "^22.0.0"
tqdm = "^4.64.1"
# Major bump to transformers 5.x clears 2 High CVEs (AMLG-13277). Only used via
# ctranslate2's TransformersConverter in the faster_whisper model-conversion path
# (app/faster_whisper/utils.py); the openai_whisper engine does not import it.
transformers = ">=5,<6"
python-multipart = ">=0.0.30,<0.0.32"
ffmpeg-python = "^0.2.0"
# Major bump to a current fastapi pulls starlette 1.x, clearing 3 High CVEs
# (AMLG-13277). The app only uses stable fastapi/starlette surface (UploadFile,
# File, Query, StreamingResponse, RedirectResponse, StaticFiles); see the
# AMLG-13277 migration notes for the retest matrix.
fastapi = ">=0.115,<2"
llvmlite = "^0.44.0"
numba = "^0.61.2"
# openai-whisper 20250625 uses a modern pyproject build; the older 20240930
# sdist imports pkg_resources in setup.py and no longer builds under the
# setuptools>=81 that the image's isolated build env now pulls (AMLG-13204).
openai-whisper = "^20250625"
faster-whisper = "^1.2.1"
torch = { version = "2.13.0", source = "pytorch-cu126" }
# Security floors for transitive deps that ship in the runtime image (AMLG-13250).
# Upper-bounded to the current major so a future `poetry update` can't pull an
# untested major (urllib3 3.x / protobuf 7.x) outside this change's scope.
urllib3 = ">=2.7.0,<3"
protobuf = ">=6.33.5,<7"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
setuptools = "<81"

[tool.poetry.group.test.dependencies]
pytest = ">=8,<10"
pytest-mock = "*"
google-cloud-storage = "^2.17.0"
moviepy = "^1.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
