env: dev
serviceAccountName: splice-dev-ksa
image:
  name: us-docker.pkg.dev/i-amlg-dev/sca/whisper-asr-webservice
  tag: main

whisperDeployment:
  resources:
    limits:
      cpu: "3100m"
      memory: "10Gi"
      gpu: "1"
    request:
      cpu: "1600m"
      memory: "7Gi"
      gpu: "1"

whisperService:
  port: 9000
  targetPort: 9000

whisperHPA:
  autoscale:
      min: 3
      max: 26
      memoryUtilization: 75
      # CPU tracks load (audio decode + CTranslate2 per request); memory is flat
      # once the model is loaded, so it never triggers a scale-out on its own.
      cpuUtilization: 40

ingress:
  # devwhisper.amlg.io is retired; whisper.dev.amlg.paramount.tech is the only
  # dev host.
  hosts:
    - whisper.dev.amlg.paramount.tech
  tls:
    - secretName: dev-amlg-paramount-tech-tls
      hosts:
        - whisper.dev.amlg.paramount.tech
