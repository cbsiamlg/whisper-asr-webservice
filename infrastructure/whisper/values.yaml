env: dev
serviceAccountName: splice-dev-ksa
image:
  name: us-docker.pkg.dev/i-amlg-dev/sca/whisper-asr-webservice
  tag: main

whisperDeployment:
  resources:
    limits:
      cpu: "3100m"
      memory: "10Gi"
      gpu: "1"
    request:
      cpu: "1600m"
      memory: "7Gi"
      gpu: "1"

whisperService:
  port: 9000
  targetPort: 9000

whisperHPA:
  autoscale:
      min: 3
      max: 26
      memoryUtilization: 75

ingress:
  # Dual-serve during the amlg.io -> paramount.tech migration; the existing
  # host keeps serving on the same certificate. Note the secret is named
  # ingress-tls here, matching prod and what this chart has always rendered;
  # the live object had drifted to the ingress-tls-2026 alias, which holds the
  # identical cert (same serial and fingerprint), so this is a no-op.
  hosts:
    - devwhisper.amlg.io
    - whisper.dev.amlg.paramount.tech
  tls:
    - secretName: ingress-tls
    - secretName: dev-amlg-paramount-tech-tls
      hosts:
        - whisper.dev.amlg.paramount.tech
