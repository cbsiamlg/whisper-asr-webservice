apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "whisper-api.name" . }}
  namespace: video-services
{{- include "whisper-api.labels" . | nindent 2}}
spec:
  # Cold starts here run to ~40+ min (GPU node autoscale + ~21 min image pull +
  # up to ~20 min model-load startupProbe). The default progressDeadlineSeconds
  # is 600s, which would mark the rollout ProgressDeadlineExceeded — and fail the
  # Helm/Codefresh deploy — long before a healthy pod could go Ready. Give the
  # rollout a deadline that covers the full startup budget (AMLG-13253).
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app: {{ template "whisper-api.name" . }}
  replicas: 3
  template:
    metadata:
      labels:
        app: {{ template "whisper-api.name" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      tolerations:
        - key: app
          operator: Equal
          value: splice-xcd
          effect: NoSchedule  
      containers:
        - name: whisper-api
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.whisperDeployment.resources.limits.cpu }}
              memory: {{ .Values.whisperDeployment.resources.limits.memory }}
              nvidia.com/gpu: {{.Values.whisperDeployment.resources.limits.gpu }}
            requests:
              cpu: {{ .Values.whisperDeployment.resources.request.cpu }}
              memory: {{ .Values.whisperDeployment.resources.request.memory }}
              nvidia.com/gpu: {{ .Values.whisperDeployment.resources.request.gpu }}
          env:
            - name: ASR_ENGINE
              value: faster_whisper
            - name: ASR_MODEL
              value: medium.en
          # The container loads/converts the ASR model at startup (single
          # uvicorn worker), which can take many minutes on a cold GPU node.
          # A startupProbe gives that a generous budget; while it is active,
          # k8s suspends liveness/readiness so the slow start can't trip them
          # into a kill-loop (AMLG-13253). ~20 min budget: 15s * 80.
          startupProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 80
          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 30
            # allow a few consecutive misses (e.g. worker briefly busy) before
            # restarting, instead of killing on a single 2s timeout.
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      nodeSelector:
        cloud.google.com/gke-nodepool: "splice-xcd-gpu-t4"


