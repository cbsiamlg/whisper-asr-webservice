apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "whisper-api.name" . }}
  namespace: video-services
{{- include "whisper-api.labels" . | nindent 2}}
spec:
  # Cold starts are dominated by GPU node autoscale and the image pull, not by
  # the app. Measured container-start -> Ready and scheduled -> container-start
  # (AMLG-13316); which row applies depends on whether GKE Image Streaming is
  # enabled on the node pool (AMLG-13315):
  #
  #                            pull      load
  #   no Image Streaming       ~4 min    ~20s     (prod v0.0.24, 20 cold pods)
  #   Image Streaming          ~2-3s     ~47-58s  (dev, 2 pods)
  #
  # Streaming does not remove the work, it moves it: the pull shrinks because
  # layers fault in lazily on first access instead, which lands in startup. The
  # startupProbe below covers the load column only; this deadline has to cover
  # node autoscale + the pull column on top of it.
  #
  # The default progressDeadlineSeconds is 600s, which would mark the rollout
  # ProgressDeadlineExceeded — and fail the Helm/Codefresh deploy — long before
  # a healthy pod could go Ready on a cold node. Keep a deadline that covers
  # node autoscale + pull with headroom, sized for the slower (unstreamed) row
  # so it stays valid on pools without streaming (AMLG-13253).
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app: {{ template "whisper-api.name" . }}
  replicas: 3
  template:
    metadata:
      labels:
        app: {{ template "whisper-api.name" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      tolerations:
        - key: app
          operator: Equal
          value: splice-xcd
          effect: NoSchedule  
      containers:
        - name: whisper-api
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.whisperDeployment.resources.limits.cpu }}
              memory: {{ .Values.whisperDeployment.resources.limits.memory }}
              nvidia.com/gpu: {{.Values.whisperDeployment.resources.limits.gpu }}
            requests:
              cpu: {{ .Values.whisperDeployment.resources.request.cpu }}
              memory: {{ .Values.whisperDeployment.resources.request.memory }}
              nvidia.com/gpu: {{ .Values.whisperDeployment.resources.request.gpu }}
          env:
            - name: ASR_ENGINE
              value: faster_whisper
            - name: ASR_MODEL
              value: medium.en
          # The container loads the ASR model at startup (single uvicorn worker).
          # The startupProbe covers that load only — its clock starts when the
          # container starts, i.e. after the image pull — and while it is active
          # k8s suspends liveness/readiness so a slow start can't trip them into
          # a kill-loop (AMLG-13253).
          #
          # The original ~20 min budget (15s * 80) was sized for the old cold
          # start, which downloaded + converted the model (~7 min). AMLG-13280
          # pre-baked it, so it loads from disk instead.
          #
          # Sized against GKE Image Streaming, which AMLG-13315 enabled on the
          # splice-xcd-gpu-t4 pool. Streaming near-eliminates the image pull
          # (201s -> 2s measured) but shifts that cost into startup, because
          # torch, the CUDA/cudnn libs and the model all fault in lazily on
          # first access: load went 13-25s (pre-streaming, 20 prod pods) to
          # 47-58s (streaming, dev). ~5 min (10s * 30) gives ~5x margin over
          # the observed 58s while still cutting detection of a genuinely hung
          # pod from ~20 min to ~5 min (AMLG-13316).
          startupProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 30
            # allow a few consecutive misses (e.g. worker briefly busy) before
            # restarting, instead of killing on a single 2s timeout.
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      nodeSelector:
        cloud.google.com/gke-nodepool: "splice-xcd-gpu-t4"


