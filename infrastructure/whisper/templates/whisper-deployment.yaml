apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "whisper-api.name" . }}
  namespace: video-services
{{- include "whisper-api.labels" . | nindent 2}}
spec:
  # Cold starts are dominated by GPU node autoscale + the image pull, not by the
  # app: measured in prod (v0.0.24, 20 pods on cold nodes) the pull alone is
  # ~4 min (scheduled -> container running) on top of node provisioning, while
  # the model load is only ~20s (AMLG-13316). The default progressDeadlineSeconds
  # is 600s, which would mark the rollout ProgressDeadlineExceeded — and fail the
  # Helm/Codefresh deploy — long before a healthy pod could go Ready. Keep a
  # deadline that covers node autoscale + pull with headroom (AMLG-13253).
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app: {{ template "whisper-api.name" . }}
  replicas: 3
  template:
    metadata:
      labels:
        app: {{ template "whisper-api.name" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      tolerations:
        - key: app
          operator: Equal
          value: splice-xcd
          effect: NoSchedule  
      containers:
        - name: whisper-api
          image: {{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.whisperDeployment.resources.limits.cpu }}
              memory: {{ .Values.whisperDeployment.resources.limits.memory }}
              nvidia.com/gpu: {{.Values.whisperDeployment.resources.limits.gpu }}
            requests:
              cpu: {{ .Values.whisperDeployment.resources.request.cpu }}
              memory: {{ .Values.whisperDeployment.resources.request.memory }}
              nvidia.com/gpu: {{ .Values.whisperDeployment.resources.request.gpu }}
          env:
            - name: ASR_ENGINE
              value: faster_whisper
            - name: ASR_MODEL
              value: medium.en
          # The container loads the ASR model at startup (single uvicorn worker).
          # The startupProbe covers that load only — its clock starts when the
          # container starts, i.e. after the image pull — and while it is active
          # k8s suspends liveness/readiness so a slow start can't trip them into
          # a kill-loop (AMLG-13253).
          #
          # The original ~20 min budget (15s * 80) was sized for the old cold
          # start, which downloaded + converted the model (~7 min). AMLG-13280
          # pre-baked it, so it now loads from disk: measured 13-25s (mean 18s)
          # across 20 prod pods on cold nodes. ~3 min (10s * 18) leaves ~7x
          # margin over the observed worst case while cutting detection of a
          # genuinely hung pod from ~20 min to ~3 min (AMLG-13316).
          startupProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /liveness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 30
            # allow a few consecutive misses (e.g. worker briefly busy) before
            # restarting, instead of killing on a single 2s timeout.
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.whisperService.port }}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      nodeSelector:
        cloud.google.com/gke-nodepool: "splice-xcd-gpu-t4"


